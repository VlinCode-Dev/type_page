<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="keyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1c1b1b"/>
    </linearGradient>
    <linearGradient id="keySide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1b1b"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- front face -->
  <path d="M5,16 L5,25 Q5,27 7,27 L25,27 Q27,27 27,25 L27,16" fill="url(#keySide)" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <!-- left side -->
  <path d="M5,5 L5,16 L5,25 Q5,27 7,27 L7,25 L7,5 Q5,5 5,5Z" fill="url(#keySide)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <!-- right side -->
  <path d="M27,5 L27,25 Q27,27 25,27 L25,25 L25,5 Q27,5 27,5Z" fill="url(#keySide)" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
  <!-- top face -->
  <rect x="5" y="3" width="22" height="14" rx="3" ry="3" fill="url(#keyTop)" stroke="rgba(255,255,255,0.25)" stroke-width="0.6" filter="url(#shadow)"/>
  <!-- top highlight -->
  <rect x="7" y="4" width="18" height="5" rx="2" fill="rgba(255,255,255,0.08)"/>
  <!-- letter T -->
  <text x="16" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#f2be8c" style="text-shadow: 0 1px 1px rgba(0,0,0,0.3);">T</text>
</svg>
